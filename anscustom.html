<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <link rel="icon" type="image/x-icon" href="./Copilot_20260510_161806.png">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ff8c00, #ff3d00);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #display {
      width: 60%;
      max-width: 100vw;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 40px;
      color: #fff;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      cursor: pointer;
      padding: 15px;
      margin: 12px 0;
      border-radius: 12px;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid transparent;
      transition: 0.3s ease;
    }

    li:hover {
      transform: scale(1.03);
      background: rgba(255, 255, 255, 0.35);
    }

    .selected {
      background: #2196f3;
      border-color: #2196f3;
    }

    .correct {
      background: #4caf50;
      border-color: #4caf50;
    }

    .wrong {
      background: #e53935;
      border-color: #e53935;
    }

    button {
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s ease;
      font-weight: 600;
      margin-top: 20px;
    }

    #submitBtn {
      width: 100%;
      background: #0033cc;
      color: white;
    }

    #submitBtn:hover {
      background: #001a66;
    }

    #nextBtn {
      width: 100%;
      background: #00c853;
      color: white;
      display: none;
    }

    #nextBtn:hover {
      background: #009624;
    }

    #prevBtn {
      width: 100%;
      background: #ffca28;
      color: black;
      display: none;
    }

    #prevBtn:hover {
      background: #ffb300;
    }

    .difficulty-btn {
      width: 100%;
      margin-top: 10px;
      background: #0033cc;
      color: #fff;
    }

    .difficulty-btn:hover {
      background: #001a66;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      flex-direction: column;
      width: 100%;
      padding-bottom: 40px;
    }

    a {
      color: white;
      text-decoration: none;
      width: 50%;
    }

    #display {
      margin: 40px;
    }
  </style>
</head>

<body>

  <style>
    body {
      background: red;
      font-family: "Segoe UI", sans-serif;
      padding: 40px;
    }

    #tokenBox {
      max-width: 500px;
      margin: 0 auto 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    #tokenInput {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
      font-size: 18px;
    }

    #loadQuizBtn {
      width: 100%;
      padding: 12px;
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    #loadQuizBtn:hover {
      background: #084298;
    }

    #display {
      margin-top: 30px;
    }
  </style>

  <div id="tokenBox">
    <h2>Enter Quiz Token</h2>
    <input type="text" id="tokenInput" placeholder="e.g. QZ-4F9A2C">
    <button id="loadQuizBtn">Load Quiz</button>
  </div>

  <div id="display"></div>

  <a href="./math.html">
    <button id="submitBtn">Back to Difficulty Selection</button>
  </a>
  <a href="customquiz.html">
    <button id="submitBtn">Back To Token Input</button>
  </a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      query,
      where,
      updateDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCbeI2bHtrcX4f8UzWoUBiyfN32ADNx8rw",
      authDomain: "quiz-app-38f6c.firebaseapp.com",
      projectId: "quiz-app-38f6c",
      storageBucket: "quiz-app-38f6c.appspot.com",
      messagingSenderId: "481790359196",
      appId: "1:481790359196:web:5d61ebf6f8bc754d0a9f59",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let questions = [];
    let currentIndex = 0;
    let selectedOption = null;
    let score = 0;
    let answered = false;

    let timerDuration = 0;
    let timeLeft = 0;
    let timerId = null;

    let loadedQuizDocId = null;
    let loadedQuizData = null;

    const clean = (t) => t.replace(/\s+/g, " ").trim();

    document.getElementById("loadQuizBtn").addEventListener("click", loadQuizByToken);

    async function loadQuizByToken() {
      const token = document.getElementById("tokenInput").value.trim();

      if (!token) return alert("Please enter a token");

      const colRef = collection(db, "quizzes");
      const q = query(colRef, where("token", "==", token));
      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        alert("Invalid token. No quiz found.");
        return;
      }

      const docSnap = snapshot.docs[0];
      loadedQuizDocId = docSnap.id;
      loadedQuizData = docSnap.data();

      // Deadline check
      if (loadedQuizData.deadline) {
        const now = new Date();
        const deadline = new Date(loadedQuizData.deadline);
        if (now > deadline) {
          alert("This quiz has expired.");
          return;
        }
      }

      // One-time use check
      if (loadedQuizData.oneTime && loadedQuizData.used) {
        alert("This quiz can only be taken once and has already been used.");
        return;
      }

      questions = loadedQuizData.questions;
      startQuiz();
    }

    async function markQuizAsUsed() {
      if (!loadedQuizDocId) return;
      const quizRef = doc(db, "quizzes", loadedQuizDocId);
      await updateDoc(quizRef, { used: true });
    }

    function startQuiz() {
      document.getElementById("tokenBox").style.display = "none";

      timerDuration = 60 * 60; // 1 hour
      timeLeft = timerDuration;

      startTimer();
      renderQuestion();
    }

    function formatTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;

      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function updateTimerDisplay() {
      const timerEl = document.getElementById("timer");
      if (timerEl) timerEl.innerText = "Time left: " + formatTime(timeLeft);
    }

    function startTimer() {
      clearInterval(timerId);
      updateTimerDisplay();
      timerId = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerId);
          endQuiz(true);
        }
      }, 1000);
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      const display = document.getElementById("display");

      answered = false;
      selectedOption = null;


      display.innerHTML = `
            <h3>Question ${currentIndex + 1} / ${questions.length}</h3>
            <h4 id="timer"></h4>

            <h1>${q.question}</h1>
            <p>Select the correct answer:</p>

            <ul id="options">
                <li>${q.options[0]}</li>
                <li>${q.options[1]}</li>
                <li>${q.options[2]}</li>
                <li>${q.options[3]}</li>
            </ul>

            <button id="submitBtn">Submit</button>
            <button id="nextBtn">${currentIndex === questions.length - 1 ? "End Quiz" : "Next Question"}</button>
            <button id="prevBtn">Previous Question</button>
        `;

      updateTimerDisplay();

      document.querySelectorAll("#options li").forEach((li) => {
        li.addEventListener("click", () => {
          if (!answered) selectOption(li);
        });
      });

      document.getElementById("submitBtn").onclick = () =>
        checkAnswer(q.solution);

      document.getElementById("nextBtn").onclick = nextQuestion;
      document.getElementById("prevBtn").onclick = prevQuestion;

      document.getElementById("nextBtn").style.display = "none";
      document.getElementById("prevBtn").style.display =
        currentIndex === 0 ? "none" : "block";
    }

    function selectOption(li) {
      selectedOption = li;
      document.querySelectorAll("#options li").forEach((opt) => (opt.className = ""));
      li.className = "selected";
    }

    function checkAnswer(correctAnswer) {
      if (!selectedOption) return alert("Please select an answer first");

      answered = true;

      const chosen = clean(selectedOption.innerText);
      const correct = clean(correctAnswer);

      const allOptions = document.querySelectorAll("#options li");

      if (chosen === correct) {
        selectedOption.className = "correct";
        score++;
      } else {
        selectedOption.className = "wrong";
        allOptions.forEach((opt) => {
          if (clean(opt.innerText) === correct) opt.classList.add("correct");
        });
      }

      allOptions.forEach((opt) => (opt.style.pointerEvents = "none"));

      document.getElementById("submitBtn").style.display = "none";
      document.getElementById("nextBtn").style.display = "block";
    }

    function nextQuestion() {
      if (!answered) return alert("Submit your answer first");

      if (currentIndex < questions.length - 1) {
        currentIndex++;
        selectedOption = null;
        renderQuestion();
      } else {
        endQuiz();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        selectedOption = null;
        renderQuestion();
      }
    }

    async function endQuiz(timeUp = false) {
      clearInterval(timerId);

      if (loadedQuizData.oneTime) {
        await markQuizAsUsed();
      }

      const display = document.getElementById("display");
      display.innerHTML = `
            <h1>Quiz Completed!</h1>
            ${timeUp ? "<h3 style='color:#ffeb3b;'>Time is up!</h3>" : "<h3>Well done!</h3>"}
            <h2>Your Score: ${score} / ${questions.length}</h2>
            <button onclick="location.reload()">Restart</button>
        `;
    }
  </script>
</body>
