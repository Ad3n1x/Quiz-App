name: QZ Live CI

on:
  push:
    branches: [main]
    paths:
      - "qz-live/**"
      - ".github/workflows/qz-live-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "qz-live/**"
      - ".github/workflows/qz-live-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qz-live-ci
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify QZ Live
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: qz-live
        run: npm install

      - name: Build frontend
        working-directory: qz-live
        run: npm run build

      - name: Install backend dependencies
        working-directory: qz-live/backend
        run: npm install

      - name: Check backend JavaScript syntax
        working-directory: qz-live/backend
        run: node --check server.js
