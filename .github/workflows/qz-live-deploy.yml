name: QZ App CI

on:
  push:
    branches: [main]
    paths:
      - "qz-live/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - ".github/workflows/qz-live-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "qz-live/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - ".github/workflows/qz-live-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qz-app-ci
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify both QZ apps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check whitespace errors
        run: git diff --check

      - name: Verify solo quiz entry points
        run: |
          test -f index.html
          test -f math.html
          test -f phyquiz.html
          test -f chemquiz.html
          test -f customquiz.html
          test -f anscustom.html
          test -f qz-shared.css
          echo "Solo quiz entry points are present."

      - name: Install QZ Live frontend dependencies
        working-directory: qz-live
        run: npm install

      - name: Build QZ Live frontend
        working-directory: qz-live
        run: npm run build

      - name: Install QZ Live backend dependencies
        working-directory: qz-live/backend
        run: npm install

      - name: Check QZ Live backend syntax
        working-directory: qz-live/backend
        run: node --check server.js
